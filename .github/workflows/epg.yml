name: epg
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL http://epg.one/epg2.xml.gz -o /tmp/src.xml.gz
      - run: python -I filter_epg.py /tmp/src.xml.gz channels.txt docs/epg.xml.gz
      - run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add docs/epg.xml.gz
          git diff --cached --quiet || git commit -m "epg: daily update"
          git push
